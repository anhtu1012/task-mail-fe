<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2c47" />
    <title>Không có kết nối — TaskBox</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(160deg, #14568a, #0a2c47);
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { margin: 0 auto; max-width: 300px; font-size: 14px; line-height: 1.5; color: rgba(255, 255, 255, 0.75); }
      button {
        margin-top: 24px;
        height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 12px;
        background: #fff;
        color: #0a2c47;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Không có kết nối mạng</h1>
      <p>TaskBox cần mạng để tải công việc của bạn. Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
